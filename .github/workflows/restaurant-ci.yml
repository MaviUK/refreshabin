name: Restaurant CI

on:
  push:
    branches:
      - agent/platform-foundation
  pull_request:
    paths:
      - 'apps/restaurant/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/restaurant-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint restaurant app
        run: pnpm --filter @ordered/restaurant lint

      - name: Build restaurant app
        run: pnpm --filter @ordered/restaurant build
